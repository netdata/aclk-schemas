name: main

on:
  push:

jobs:
  main:
    name: main
    runs-on: 'ubuntu-24.04'

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.3'

      - name: Install tools
        run: make tools

      - name: Linting
        run: make lint

      - name: Breaking changes
        run: make breaking
